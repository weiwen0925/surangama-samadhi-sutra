<title>首楞嚴過招場</title>
<meta name="description" content="《佛說首楞嚴三昧經》卷上第一～二品（序分架構、辯證圖形）影片複習遊戲：序脈排序、疑者出招你來接、經文白話、原文填空、中論對讀、配對快打。原典與白話依首楞嚴三昧經讀本逐字照錄。">

<style>
/* 版式：門頁「首楞嚴三昧經導讀影片」朱砂暖色框景的延伸——赭墨底、朱砂線、朱印「過招」、象牙原典卡；單一深色（與門頁一致，刻意不做淺色） */
:root{
  --ink-0:#140d0a; --ink-1:#1c1410; --ink-2:#21181a; --ink-3:#2c1e17;
  --line:rgba(219,140,104,.24); --line-2:rgba(219,140,104,.5);
  --sa:#db8c68; --sa2:#b0603f; --sink:#f6dccb; --text:#f3e4d8; --mute:#c3b39a; --cream:#fff1e6; --celadon:#d5ece4;
  --seal:#a8402e; --seal-ink:#fbe9dc;
  --ivory-line:rgba(246,220,203,.4); --ivory-wash:rgba(246,220,203,.06);
  --ok:#9fd6c4; --ok-bg:rgba(159,214,196,.12); --bad:#ef7d8a; --bad-bg:rgba(239,125,138,.13);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-latin:"Cormorant Garamond","Times New Roman",serif;
  --r:12px; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink-1)}
body{margin:0;background:radial-gradient(80% 50% at 50% 0%,rgba(219,140,104,.13),transparent 70%),var(--ink-1);color:var(--text);font-family:var(--f-body);font-size:18px;line-height:1.75;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--sa);outline-offset:3px}
a{color:var(--sa)}
.wrap{position:relative;max-width:960px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.frame{position:relative;border:1px solid var(--line-2);border-radius:22px;padding:34px 30px 30px;background:linear-gradient(180deg,rgba(44,30,23,.82),rgba(33,24,19,.62));box-shadow:0 0 0 1px rgba(219,140,104,.08),0 34px 70px -34px rgba(0,0,0,.8);overflow:hidden}
.frame::after{content:"";position:absolute;inset:9px;border:1px solid rgba(219,140,104,.12);border-radius:16px;pointer-events:none}
.frame::before{content:"定";position:absolute;right:-26px;top:-60px;font-family:var(--f-display);font-size:300px;font-weight:900;line-height:1;color:rgba(219,140,104,.05);pointer-events:none}
@media (max-width:640px){.frame{padding:24px 14px 20px;border-radius:16px}.frame::before{font-size:200px}}
.top{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.eyebrow{font-family:var(--f-latin);font-style:italic;font-size:clamp(16px,3.2vw,21px);letter-spacing:.12em;color:var(--sa2)}
.ttl{display:inline-flex;align-items:center;gap:16px}
h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(32px,7vw,46px);letter-spacing:.18em;color:var(--sink);text-wrap:balance;line-height:1.2}
.seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:38px;height:58px;border-radius:4px;background:var(--seal);color:var(--seal-ink);font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.15;box-shadow:inset 0 0 0 2px rgba(251,233,220,.35),0 4px 10px -4px rgba(0,0,0,.6);transform:rotate(-3deg);flex:none}
.vol{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:17px;letter-spacing:.12em;color:var(--text)}
.vol b{font-weight:700;color:var(--sa)}
.sub{margin:0;color:var(--mute);font-size:17px;max-width:40em}
.backs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font-size:15px}
.backs a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line-2)}
.backs a:hover{color:var(--sa);border-bottom-color:var(--sa)}
.backs a.yt{color:var(--sa)}
.pins{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0 0}
.pin{display:flex;align-items:baseline;gap:8px;padding:7px 16px;border:1px solid rgba(219,140,104,.4);border-radius:999px;background:rgba(219,140,104,.05);transition:border-color .2s,transform .2s}
.pin b{font-family:var(--f-display);font-weight:500;font-size:14px;color:var(--mute)}
.pin span{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--text)}
.pin:hover{border-color:var(--sa);transform:translateY(-1px)}
.pin[aria-current="true"]{border-color:var(--sa);background:linear-gradient(180deg,#eab08f,#c97452);box-shadow:0 4px 12px -5px rgba(219,140,104,.6)}
.pin[aria-current="true"] b{color:#5a2c1a}.pin[aria-current="true"] span{color:#2a140c}
@media (max-width:520px){.pin{padding:6px 12px}.pin span{font-size:16px}}
.stages{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(20,13,10,.3)}
@media (max-width:520px){.stages{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px}.stg span{font-size:17px}}
@media (min-width:760px){.stages{grid-template-columns:repeat(6,minmax(0,1fr))}}
.stg{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px 7px;border:1px solid rgba(219,140,104,.32);border-radius:8px;background:rgba(219,140,104,.05);text-align:center;min-width:0;transition:border-color .2s,transform .2s,box-shadow .2s}
.stg:hover{border-color:var(--sa);transform:translateY(-2px)}
.stg b{font-family:var(--f-display);font-weight:500;font-size:13px;color:var(--mute)}
.stg span{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.4;color:var(--text)}
.stg em{font-style:italic;font-family:var(--f-latin);font-size:15px;color:var(--sa2);min-height:1.2em;line-height:1.3}
.stg[aria-current="true"]{border-color:var(--sa);background:linear-gradient(180deg,#eab08f,#c97452);box-shadow:0 6px 16px -8px rgba(219,140,104,.7)}
.stg[aria-current="true"] b,.stg[aria-current="true"] em{color:#5a2c1a}
.stg[aria-current="true"] span{color:#2a140c;font-weight:700}
main{position:relative;margin-top:22px}
.panel{display:flex;flex-direction:column;gap:16px}
.ptitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.ptitle h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(23px,4.6vw,28px);letter-spacing:.08em;color:var(--sink)}
.ptitle p{margin:0;font-family:var(--f-latin);font-style:italic;font-size:18px;color:var(--sa2)}
.hint{margin:0;color:var(--mute);font-size:17px}
.retreat{margin:0;font-size:17px;color:var(--sa);border-left:2px solid var(--ivory-line);padding-left:12px}
.qrow{display:flex;gap:18px;align-items:flex-start;border:1px solid var(--line-2);border-radius:var(--r);padding:18px;background:linear-gradient(180deg,rgba(219,140,104,.09),rgba(33,24,19,.62))}
.pill{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:72px}
.pill i{font-style:normal;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;min-height:72px;padding:8px 6px;border-radius:4px;background:var(--seal);color:var(--seal-ink);font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.12em;box-shadow:inset 0 0 0 2px rgba(251,233,220,.3),0 4px 10px -4px rgba(0,0,0,.6);transform:rotate(-2deg)}
.pill small{font-size:13px;color:var(--mute);letter-spacing:.06em;text-align:center}
.qt{min-width:0;display:flex;flex-direction:column;gap:6px}
.qbig{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.6vw,30px);line-height:1.5;color:var(--cream);text-wrap:balance}
.qmeta{margin:0;font-size:16px;color:var(--mute)}
.qmeta b{color:var(--text);font-weight:500}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:680px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid rgba(219,140,104,.34);border-radius:10px;background:rgba(219,140,104,.05);padding:13px 16px;min-width:0;transition:border-color .2s,background .2s}
.opt strong{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--text)}
.opt span{font-size:15px;color:var(--mute)}
.opt.plain{font-size:18px;line-height:1.6;color:var(--text)}
.opt:hover:not(:disabled){border-color:var(--sa);background:rgba(219,140,104,.11)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok)} .opt.right strong,.opt.plain.right{color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)} .opt.wrong strong,.opt.plain.wrong{color:var(--bad)}
.opt.dim{opacity:.45}
.fb{border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line-2);background:rgba(33,24,19,.7)}
.fb.ok{border-color:rgba(159,214,196,.55);background:linear-gradient(180deg,var(--ok-bg),rgba(33,24,19,.62))}
.fb.no{border-color:rgba(239,125,138,.55);background:linear-gradient(180deg,var(--bad-bg),rgba(33,24,19,.62))}
.fb h3{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.06em}
.fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--bad)}
.fb p{margin:0}
.fb b{color:var(--cream);font-weight:600}
.verse{border:1px solid var(--ivory-line);border-radius:10px;padding:12px 18px;background:var(--ivory-wash);box-shadow:inset 0 0 0 3px rgba(28,19,15,.55),inset 0 0 0 4px rgba(219,140,104,.2)}
.verse .lab{font-size:14px;letter-spacing:.12em;color:var(--sa);font-weight:700}
.verse .src{margin:4px 0 0;text-align:right;font-size:14px;color:var(--mute);letter-spacing:.06em}
.verse .ln{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(19px,4vw,22px);line-height:1.85;color:var(--cream);letter-spacing:.04em}
.quote{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.8;color:var(--cream)}
.vlink{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0;font-size:16px}
.vlink a{text-decoration:none;border-bottom:1px solid var(--ivory-line)}
.vlink a:hover{color:var(--cream);border-bottom-color:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid rgba(219,140,104,.4);border-radius:999px;background:rgba(219,140,104,.05);padding:7px 18px;font-size:17px;font-family:var(--f-display);font-weight:600;color:var(--text)}
.chip:hover:not(:disabled){border-color:var(--sa);background:rgba(219,140,104,.13)}
.chip.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .chip.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.score{font-size:16px;color:var(--mute);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--sa);border-radius:999px;padding:10px 24px;background:linear-gradient(180deg,#eab08f,#c97452);color:#2a140c;font-weight:700;letter-spacing:.1em;font-size:17px;box-shadow:0 4px 12px -5px rgba(219,140,104,.6)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:rgba(219,140,104,.06);color:var(--text);border-color:var(--line-2);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.olist{display:flex;flex-direction:column;gap:10px}
.ocard{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid rgba(219,140,104,.32);border-radius:10px;background:rgba(219,140,104,.05);padding:12px 16px;transition:border-color .2s}
.ocard:hover{border-color:var(--sa)}
.ocard .n{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px dashed var(--sa2);font-family:var(--f-latin);font-size:19px;color:var(--sa2);font-variant-numeric:tabular-nums}
.ocard.sel{border-color:var(--line-2);background:rgba(219,140,104,.11)}
.ocard.sel .n{background:var(--seal);border:none;color:var(--seal-ink);font-weight:600;box-shadow:inset 0 0 0 1.5px rgba(251,233,220,.4)}
.ocard .t{min-width:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.6;color:var(--text)}
.ocard .t .score{font-family:var(--f-body);font-weight:400;font-size:15px}
.ocard .t a{font-family:var(--f-body);font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap}
.ocard.good{background:var(--ok-bg);border-color:rgba(159,214,196,.6)} .ocard.good .n{background:var(--ok);border:none;color:#12261a}
.ocard.badpos{background:var(--bad-bg);border-color:rgba(239,125,138,.6)} .ocard.badpos .n{background:var(--bad);border:none;color:#2a120b}
.link{margin:-2px 0 0 48px;font-size:16px;color:var(--sa)}
.blank{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--sa);text-align:center;color:var(--sa)}
.blank.filled{border-bottom-color:var(--ok);color:var(--ok)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mcol h4{margin:0;font-size:15px;color:var(--mute);font-weight:500;letter-spacing:.1em}
.mi{text-align:left;border:1px solid rgba(219,140,104,.32);border-radius:10px;background:rgba(219,140,104,.05);padding:11px 13px;font-size:17px;line-height:1.55;min-width:0;color:var(--text)}
.mi:hover:not(:disabled){border-color:var(--sa)}
.mi.pick{border-color:var(--sa);box-shadow:0 0 0 2px var(--sa) inset;background:rgba(219,140,104,.14)}
.mi.done{background:var(--ok-bg);border-color:var(--ok);opacity:.6}
.mi.shake{background:var(--bad-bg);border-color:var(--bad)}
.mi .src{display:block;font-size:13px;color:var(--sa2);letter-spacing:.08em}
.end{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.big{margin:0;font-family:var(--f-latin);font-weight:500;font-size:clamp(34px,7vw,46px);line-height:1.2;color:var(--sa);font-variant-numeric:tabular-nums}
.road{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;font-family:var(--f-display);font-size:16px;color:var(--text)}
.road span{border:1px solid var(--line-2);border-radius:6px;padding:2px 10px;background:rgba(219,140,104,.06)}
.road i{font-style:normal;color:var(--sa2)}
.foot{position:relative;margin-top:26px;padding-top:14px;border-top:1px dashed var(--line);color:var(--mute);font-size:15px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.foot i{font-family:var(--f-latin);letter-spacing:.1em;color:var(--sa2)}
@media (prefers-reduced-motion:no-preference){
  .fb,.end{animation:rise .3s ease-out}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>

 <div class="frame">

  <footer class="foot">
    <span>原典與白話依「首楞嚴三昧經讀本」卷上各品站頁逐字照錄（鳩摩羅什譯）；中論頌依讀本中觀義理卡所引。成績只存在這台裝置的瀏覽器。</span>
    <i>Fascicle I · Chapters 1 – 2</i>
  </footer>
 </div>

/* ───────── 資料：卷上各品（原典與白話依讀本逐字；說明依導讀影片解說） ───────── */
const P={"1":{"pin":1,"name":"序分架構","short":"序分","vid":"xxe-U1U3Zq0","dur":"14:12","sub":"看完導讀影片，換你上場：疑者一路發問，你從經文找出那一招。六關由易而難，最後把序分讀成一句——安住三昧而不動轉。","o1t":"序脈排序","o1n":"序脈","o1h":"序分的經文一節接一節，回答讀者心裡的疑問：前一個答案，引出下一個問題。依經文先後點選排序。","end1":"九個疑問一路走完：從「如是我聞」，走到佛的一句「隨汝所問」。下面是序分走成的路。","end2":"請帶走這一句：「安住三昧而不動轉」——住而後問。想再深一層，去讀本做本品十題過關檢核。","ROAD":["如是我聞","菩薩德行","安住不動轉","二十六名號","依名入義","因病與藥","捨離之心","隨汝所問"],"SEG":{"1":{"lab":"第一節","n":"如是我聞・法會處所","t":113,"ch":"2-1"},"2":{"lab":"第二節","n":"菩薩德行總說・眾所知識","t":213,"ch":"2-2"},"3":{"lab":"第三節","n":"二十六位菩薩名號與大會眾","t":370,"ch":"2-3"},"4":{"lab":"第四節","n":"堅意菩薩之念言與請問","t":571,"ch":"2-4"}},"A":[{"id":"A1","seg":1,"round":"第一節","q":"經文一開頭的「如是我聞」，只是客套的開場吧？","basis":"經典開頭大多這麼寫","keep":"開場白無關緊要","name":"結集者的證言","tag":"以下所記皆為親聞，非後人自造","gist":"「如是我聞」：我是這樣親自聽到的。它不是客套的開場，而是結集者的證言：以下所記，都是親聞，不是後人自造。","src":[{"lab":"原典・第一節","q":"如是我聞"}],"next":"開場交代了「誰聽到」，接著交代「在哪裡、有誰」：人數這一筆，也有話要說嗎？"},{"id":"A2","seg":1,"round":"第一節","q":"比丘三萬二千、菩薩七萬二千，不過是一筆人數紀錄？","basis":"序分照例交代時、處、眾","keep":"人數只是背景","name":"菩薩倍於比丘・大乘法會","tag":"人數比例本身已預告：此會以菩薩為主體","gist":"菩薩七萬二千，比丘三萬二千，菩薩多了一倍以上。這個比例本身已經預告：這不是以聲聞為主體的集會，而是一場大乘法會。","src":[{"lab":"原典・第一節","q":"一時，佛在王舍城耆闍崛山中，與大比丘僧三萬二千人俱，菩薩摩訶薩七萬二千——"}],"next":"菩薩既是主角，經文接著一口氣列出他們的德行。十六句排比，重點在哪裡？"},{"id":"A3","seg":2,"round":"第二節","q":"十六句德行排比，讀來繁複，抓得到重點嗎？","basis":"一長串讚歎，看似平鋪直敘","keep":"十六句一樣輕重","name":"地基兩句","tag":"「安住三昧而不動轉」說心不動；「悉以得住三解脫門」說所住是空、無相、無作","gist":"這一段真正的地基是兩句：「安住三昧而不動轉」，說心不動；「悉以得住三解脫門」，說所安住的是空、無相、無作。後面整品的伏筆，都靠這兩句撐住。","src":[{"lab":"原典・第二節","q":"安住三昧而不動轉，善能了知無盡之慧，得深法忍入深法門"},{"lab":"原典・第二節","q":"悉以得住三解脫門，以無礙智通達三世"}],"next":"菩薩既已「安住三昧而不動轉」，那堅意菩薩後來起身合掌，算不算動了？"},{"id":"A4","seg":2,"ch":"6-1","round":"第二節","q":"菩薩已「安住三昧而不動轉」，堅意菩薩卻起身合掌——這不就動了？","basis":"起身、偏袒右肩、右膝著地，都是動作","keep":"靜與動只能取一","name":"住而後問","tag":"起身不是心隨境轉；心住三解脫門，為眾生而問","gist":"有了「安住三昧」「三解脫門」這個地基，堅意菩薩起身發問，就不是心隨境轉，而是住而後問。靜是住於三解脫門，動是為眾生而問，兩者不是矛盾，而是同一件事的兩面。","src":[{"lab":"原典・第二節","q":"安住三昧而不動轉"},{"lab":"原典・第四節","q":"作是念已，即從座起，偏袒右肩右膝著地，合掌向佛"}],"next":"德行說完，經文轉入名單：二十六位菩薩名號。這只是一份名冊嗎？"},{"id":"A5","seg":3,"round":"第三節","q":"二十六位菩薩名號，不過是一份與會名冊？","basis":"名字一個接一個列下去","keep":"名號只是標籤","name":"名號即德行之名","tag":"「諸根常定不亂」對「安住三昧而不動轉」；「辯才莊嚴」對「成就辯才樂說無盡」","gist":"這些名號幾乎都是德行的具體化：「諸根常定不亂菩薩」，正對應上文的「安住三昧而不動轉」；「辯才莊嚴菩薩」，對應「成就辯才樂說無盡」。名單其實是把德行一一立了名。","src":[{"lab":"原典・第三節","q":"諸根常定不亂菩薩、實音聲菩薩、一切天讚菩薩、陀羅尼自在王菩薩、辯才莊嚴菩薩"}],"next":"名號既然對應德行，每位菩薩是不是就有那個名號所說的固定身分？"},{"id":"A6","seg":3,"ch":"5-2","round":"第三節","q":"名號對應德行，那「轉不退法輪菩薩」就有轉不退法輪的固定身分吧？","basis":"名字說的就是他","keep":"名號背後有一個固定的自性","name":"方便稱名・依名入義","tag":"就緣起中某一顯著功用而立名；可以依名入義，不可以執名為實","gist":"若名號有自性，「轉不退法輪菩薩」就只能是轉不退法輪，不能兼具其他德行；可是經文明說「其諸菩薩德皆如是」，每位菩薩都具足前面的德行。所以名號是就緣起中某一個顯著的功用而立的方便稱名，可以依名入義，不可以執名為實。","src":[{"lab":"原典・第二節","q":"其諸菩薩德皆如是"}],"next":"名號說清楚了，輪到發問者：堅意菩薩已通達三世，為什麼還要問？"},{"id":"A7","seg":4,"round":"第四節","q":"菩薩已「以無礙智通達三世」，還有什麼不知道、需要問？","basis":"問，通常是因為不知道","keep":"發問是為了求知","name":"因病與藥・無一為己","tag":"十餘項對治清單，每一問都對應一類眾生的病","gist":"堅意菩薩起身之前，先在心裡列了一張清單：守護佛種、法種、僧種，令魔宮隱蔽，摧伏增上慢，令種善根、令發心、令不退……十幾項，沒有一項是為了自己。這就是因病與藥：每一問都對應一類眾生的病。","src":[{"lab":"原典・第四節","q":"我於今者當問如來，以是所問，欲守護佛種、法種、僧種，令諸魔宮隱蔽不現，摧伏自大增上慢者"}],"next":"清單十幾項，哪一項最要緊？要治的又是什麼病？"},{"id":"A8","seg":4,"ch":"4-2","round":"第四節","q":"要度眾生，給他們一個更好的見解，不就好了？","basis":"錯的見解換成對的見解","keep":"用新見解取代舊見解","name":"令發捨離之心","tag":"計有所得住諸見者，皆悉令發捨離之心","gist":"整張清單的核心是這一句：要治的不是知識不夠，而是「有所得」的心態本身。不是勸人改信一個更好的見解，而是令他捨離有所得的心——這和《中論》破見顯空，是同一條路。","src":[{"lab":"原典・第四節","q":"計有所得住諸見者，皆悉令發捨離之心"}],"next":"一切見都要捨，實相又不可言說——堅意菩薩這一問、佛這一答，還有必要嗎？"},{"id":"A9","seg":4,"ch":"6-2","round":"第四節","q":"實相既然不可言說，發問、答問不都多餘？","basis":"言語道斷，說了也到不了","keep":"不可說，就不該說","name":"不可執故能說","tag":"堅意「少有所問」，佛答「隨汝所問，吾當解說」","gist":"不是「不可說故不說」，而是「不可執故能說」：正因實相不可執取，言說才可以自由地作為方便使用。所以堅意菩薩說「少有所問」，佛答「隨汝所問，吾當解說，令汝歡喜」。","src":[{"lab":"原典・第四節","q":"世尊！我今欲於如來法中少有所問，唯願聽許。"},{"lab":"原典・第四節","q":"隨汝所問，吾當解說，令汝歡喜。"}],"next":""}],"W":[{"seg":1,"q":"如是我聞","a":"我是這樣親自聽聞的","x":["我聽說好像是這樣","如此這般，我才終於聽懂","我願意這樣聽從佛說"]},{"seg":2,"q":"眾所知識得陀羅尼","a":"眾人所共同認識的大士：他們已得陀羅尼（總持而不忘失的能力）","x":["眾人都知道陀羅尼是一種咒語，人人可得","大家都在學習怎麼得到陀羅尼","眾生所知道的學問，都已寫成陀羅尼"]},{"seg":2,"q":"成就辯才樂說無盡","a":"成就辯才而樂於說法無有窮盡","x":["辯才好到別人說不過他，所以很快樂","說話沒完沒了，停不下來","贏得辯論，享受無盡的讚美"]},{"seg":2,"q":"安住三昧而不動轉","a":"安住在三昧之中而心不動搖、不轉變","x":["在三昧中靜坐，身體一動也不動","住在三昧裡面，從此不再轉生","安穩地住著，不再轉動法輪"]},{"seg":2,"q":"得深法忍入深法門","a":"得到甚深的法忍、進入甚深的法門","x":["忍受深奧佛法的艱苦，勉強入門","得到很深的忍耐力，可以進入山門","忍住不說深法，只開淺門"]},{"seg":2,"q":"摧伏眾魔降諸怨敵","a":"摧折降伏眾魔與一切怨敵","x":["與魔王結盟，化敵為友","躲避眾魔，遠離怨家","被眾魔摧伏，向怨敵投降"]},{"seg":2,"q":"有大慈悲諸相嚴身","a":"以大慈悲心而使諸相莊嚴其身","x":["以華麗的衣飾莊嚴身體","有慈悲心的人，長相都很端正","用各種威猛的相貌嚇阻眾生"]},{"seg":2,"q":"於大精進得到彼岸","a":"在大精進上已到達彼岸","x":["精進划船，渡到河的對岸","用盡力氣，終於抵達海邊","因為精進太過，反而停在此岸"]},{"seg":2,"q":"善知一切言辭方便","a":"善於通曉一切言辭的方便","x":["懂得說好話討人歡心","通曉各國語言，旅行方便","善於寫文章、作詩詞"]},{"seg":2,"q":"悉以得住三解脫門","a":"全都已安住於三解脫門","x":["都已走出三道解脫的大門","都住在三座解脫寺裡","全都拿到三扇門的鑰匙"]},{"seg":2,"q":"以無礙智通達三世","a":"以無有障礙的智慧通達過去、現在、未來三世","x":["用沒有障礙的身體遊歷三界","用智慧打通三個世界的道路","用聰明才智通曉三代的歷史"]},{"seg":2,"q":"發決定心不捨一切","a":"發起決定之心而不捨棄任何一個眾生","x":["下定決心，什麼東西都不肯丟","心意已決，一切都不再改變","決定出家，卻捨不得一切親人"]},{"seg":2,"q":"憶念義趣堪忍智慧","a":"憶持所念的義理旨趣並具足堪能安忍的智慧","x":["回憶有趣的往事，忍住不笑","記得意義與趣味，忍耐愚痴的人","想念朋友的情義，忍受離別"]},{"seg":3,"q":"多種善根樂大法者","a":"多生種下善根而喜樂大法的","x":["種了很多樹根，喜歡大場面","善根種得多，所以快樂又富有","種種善人都喜歡大型法會"]},{"seg":4,"q":"令諸魔宮隱蔽不現","a":"使諸魔的宮殿隱蔽而不能現起","x":["讓魔王把宮殿藏起來保護自己","令魔宮隱身，伺機作亂","把魔宮遮起來，好讓人看不見佛"]},{"seg":4,"q":"摧伏自大增上慢者","a":"摧折降伏那些自大而生增上慢的人","x":["摧毀自己的大我，增加傲慢","讓自大的人更加上進","打倒比自己大、比自己快的人"]},{"seg":4,"q":"計有所得住諸見者，皆悉令發捨離之心","a":"那些計較有所得、安住在種種見解裡的人，全都令他發起捨離之心","x":["那些計算收入、住在各處的人，全都令他離家","有所得的人，都令他把所得捨給別人","住在各種見解裡的人，都令他換一個更好的見解"]},{"seg":4,"q":"樂小法者令不疑大法","a":"喜樂小法的人令他對大法不生疑惑","x":["喜歡小法的人，要令他放棄小法","喜歡小法的人，不必讓他知道大法","喜歡小法的人，令他懷疑大法"]},{"seg":4,"q":"偏袒右肩右膝著地","a":"把右肩的衣服偏開、右膝著地","x":["偏向右邊坐，右腳伸直","袒護右邊的人，跪在地上","把右肩靠在地上休息"]},{"seg":4,"q":"我今欲於如來法中少有所問，唯願聽許","a":"我今天想在如來的法中稍有請問，唯願您允許","x":["我今天沒什麼問題，只想聽講","我想問如來一點私事，請您聽我說","我想在如來的法會中，聽一點點就好"]},{"seg":4,"q":"隨汝所問，吾當解說，令汝歡喜","a":"隨你所問，我當為你解說，令你歡喜","x":["問題隨你，但我只解說令你歡喜的部分","跟著你的問題走，我自己也很歡喜","你問什麼都行，但我不一定回答"]}],"F":[{"seg":1,"v":["如是我聞：","一時，佛在王舍城耆闍崛山中，"],"ln":1,"ans":"王舍城","opts":["王舍城","舍衛國","毘舍離","迦毘羅"],"note":"法會處所"},{"seg":1,"v":["與大比丘僧三萬二千人俱，","菩薩摩訶薩七萬二千——"],"ln":1,"ans":"七萬二千","opts":["七萬二千","三萬二千","八萬四千","一萬二千"],"note":"菩薩倍於比丘"},{"seg":2,"v":["眾所知識得陀羅尼，成就辯才樂說無盡，","安住三昧而不動轉，善能了知無盡之慧，"],"ln":1,"ans":"不動轉","opts":["不動轉","不退轉","不散亂","不生滅"],"note":"地基兩句之一"},{"seg":2,"v":["悉以得住三解脫門，以無礙智通達三世，"],"ln":0,"ans":"三解脫門","opts":["三解脫門","四聖諦法","三昧正受","無量法門"],"note":"地基兩句之二"},{"seg":2,"v":["悉以得住三解脫門，以無礙智通達三世，"],"ln":0,"ans":"通達三世","opts":["通達三世","了知三界","遍知十方","觀察三時"],"note":"智柱：所知已無滯礙"},{"seg":2,"v":["於大精進得到彼岸，善知一切言辭方便，"],"ln":0,"ans":"言辭方便","opts":["言辭方便","世間技藝","神通變化","經論義理"],"note":"方便柱：有證而能起用"},{"seg":2,"v":["發決定心不捨一切，憶念義趣堪忍智慧，","其諸菩薩德皆如是——"],"ln":1,"ans":"皆如是","opts":["皆如是","各不同","有高下","不可說"],"note":"名號無自性的根據"},{"seg":3,"v":["諸根常定不亂菩薩、實音聲菩薩、"],"ln":0,"ans":"常定不亂","opts":["常定不亂","寂靜無為","清淨無垢","堅固不動"],"note":"名號對應「安住三昧而不動轉」"},{"seg":3,"v":["文殊師利法王子菩薩、彌勒菩薩、"],"ln":0,"ans":"彌勒","opts":["彌勒","普賢","觀世音","地藏"],"note":"二十六位菩薩名號"},{"seg":3,"v":["喜王菩薩、堅勢菩薩、堅意菩薩。"],"ln":0,"ans":"堅意","opts":["堅意","淨意","大相","光德"],"note":"名單最後一位，正是本品的發問者"},{"seg":4,"v":["欲守護佛種、法種、僧種，","令諸魔宮隱蔽不現，"],"ln":0,"ans":"僧種","opts":["僧種","戒種","智種","慧種"],"note":"守護三寶之種"},{"seg":4,"v":["未種善根者今當令種、","已種善根者當令增長，"],"ln":1,"ans":"增長","opts":["增長","成就","不退","堅固"],"note":"對象換，藥就換"},{"seg":4,"v":["計有所得住諸見者，","皆悉令發捨離之心，"],"ln":1,"ans":"捨離","opts":["捨離","歡喜","精進","厭離"],"note":"整張清單的核心"},{"seg":4,"v":["樂小法者令不疑大法、","樂大法者令生歡喜。"],"ln":0,"ans":"不疑","opts":["不疑","捨棄","轉修","讚歎"],"note":"不強齊一，是慈悲之細"},{"seg":4,"v":["「世尊！我今欲於如來法中少有所問，","唯願聽許。」"],"ln":0,"ans":"少有所問","opts":["少有所問","廣有所問","多所請問","略有所疑"],"note":"以最少的言辭啟動最廣的度化"},{"seg":4,"v":["佛告堅意：","「隨汝所問，吾當解說，令汝歡喜。」"],"ln":1,"ans":"歡喜","opts":["歡喜","開解","得度","無疑"],"note":"佛的允許：序分結束，正說開始"}],"V":{"V1":{"p":"觀四諦品第二十四","v":["眾因緣生法，我說即是空，","亦為是假名，亦是中道義。"]},"V2":{"p":"歸敬偈","v":["不生亦不滅，不常亦不斷，","不一亦不異，不來亦不出。"]},"V3":{"p":"觀法品第十八","v":["若無有我者，何得有我所？","滅我我所故，名得無我智。"]},"V4":{"p":"觀行品第十三","v":["大聖說空法，為離諸見故；","若復見有空，諸人不可化。"]},"V5":{"p":"觀因緣品第一","v":["如諸法自性，不在於緣中，","以無自性故，他性亦復無。"]},"V6":{"p":"觀涅槃品第二十五","v":["無得亦無至，不斷亦不常，","不生亦不滅，是說名涅槃。"]},"V7":{"p":"觀法品第十八","v":["諸佛或說我，或說於無我，","諸法實相中，無我無非我。"]},"V8":{"p":"觀有無品第十五","v":["若人見有無，見自性他性，","如是則不見，佛法真實義。"]},"V9":{"p":"觀如來品第二十二","v":["如來所有性，即是世間性，","如來無有性，世間亦無性。"]},"V10":{"p":"觀三相品第七","v":["如幻亦如夢，如乾闥婆城，","所說生住滅，其相亦如是。"]},"V11":{"p":"觀去來品第二","v":["已去無有去，未去亦無去，","離已去未去，去時亦無去。"]},"V12":{"p":"觀法品第十八","v":["諸法實相者，心行言語斷，","無生亦無滅，寂滅如涅槃。"]},"V13":{"p":"觀四諦品第二十四","v":["以有空義故，一切法得成，","若無空義者，一切則不成。"]}},"K":[{"seg":1,"ch":"2-1","q":"一時，佛在王舍城耆闍崛山中，與大比丘僧三萬二千人俱","h":"時、處、數記得極詳，卻無一有自性","a":"V1","d":"二諦不相礙：正因是假名，才記得下來；正因無自性，記下來也不成執。","o":["V6","V8","V11"]},{"seg":2,"ch":"2-2","q":"悉以得住三解脫門","h":"起身發問時，德行不增也不減","a":"V2","d":"故菩薩起身發問時德行不減，說法度眾時德行不增。","o":["V4","V10","V3"]},{"seg":3,"ch":"2-3","q":"其名曰：轉不退法輪菩薩、發心即轉法輪菩薩","h":"名號一被讀成身分，就立了「我」與「我的」","a":"V3","d":"名號一旦被讀成「我是某某菩薩」，即立我；隨之而有「我的德行、我的位次」，即立我所。","o":["V1","V13","V11"]},{"seg":4,"ch":"2-4","q":"計有所得住諸見者，皆悉令發捨離之心","h":"連「空」也不可再執為所得","a":"V4","d":"若把「空」再執為一個所得之境，病比先前更重。","o":["V9","V5","V2"]},{"seg":2,"ch":"3-1","q":"以無礙智通達三世……安住三昧而不動轉……成就辯才樂說無盡","h":"智、定、方便三柱，互待而成","a":"V5","d":"三柱是互待而成：無智則定成枯定，無定則智成浮辯，無方便則二者不能及人。","o":["V12","V10","V1"]},{"seg":2,"ch":"3-2","q":"安住三昧而不動轉","h":"三昧不是可入可出、可得可失之境","a":"V6","d":"相對的安靜必落兩邊——以為定境可長保是「常」，以為出定即失是「斷」。","o":["V3","V7","V13"]},{"seg":4,"ch":"4-2","q":"未種善根者今當令種、已種善根者當令增長","h":"對象換，藥就換","a":"V7","d":"堅意菩薩的四對機四對治即此隨宜之理的展開：對象換，藥即換。","o":["V11","V9","V1"]},{"seg":4,"ch":"4-3","q":"皆悉令發捨離之心","h":"所破的是「見」，不是「法」","a":"V8","d":"破邪顯正並不是以正見取代邪見，而是使一切見自息","o":["V5","V10","V6"]},{"seg":4,"ch":"5-1","q":"偏袒右肩右膝著地，合掌向佛","h":"表相與實相，不是兩樣東西","a":"V9","d":"說「偏袒右肩合掌請問」與說「安住三昧而不動轉」，所指是同一位菩薩的同一刻。","o":["V13","V3","V12"]},{"seg":2,"ch":"5-3","q":"有大慈悲諸相嚴身……攝取最尊嚴淨佛土","h":"名相莊嚴：說它是幻，不是說一無所有","a":"V10","d":"相宛然而不可得，不可得而相宛然。","o":["V7","V12","V2"]},{"seg":4,"ch":"6-1","q":"作是念已，即從座起","h":"起身宛然，動的自性卻找不到","a":"V11","d":"動作宛然而動之自性不可得，故此動不違「不動轉」。","o":["V3","V8","V13"]},{"seg":4,"ch":"6-2","q":"隨汝所問，吾當解說，令汝歡喜","h":"言語道斷，斷的是「以言語取得實相」這條路","a":"V12","d":"若言語斷即不許發問，則佛不應答「隨汝所問」。","o":["V1","V5","V9"]},{"seg":4,"ch":"7-3","q":"若有未發阿耨多羅三藐三菩提心者當令發心","h":"空不是崩壞，而是一切得以成立的前提","a":"V13","d":"正因性空，三解脫門才可安（無一定境須守）、慈悲對照表才可行（藥病俱可轉）、名號才可立（假名無礙）。","o":["V4","V10","V6"]}]},"2":{"pin":2,"name":"辯證圖形","short":"辯證圖形","vid":"21FpGvWuLj0","dur":"14:15","sub":"看完導讀影片，換你上場：堅意菩薩開出一張需求規格，疑者一路追問，你從經文找出那一招。最後把全品讀成一句——於般涅槃而不永滅。","o1t":"問題鏈排序","o1n":"問題鏈","o1h":"堅意一問、佛一讚、佛一答：每個答案都引出下一個疑問。依經文先後點選排序。","end1":"十個疑問一路走完：從堅意的「頗有三昧」，走到佛的「獨步無畏猶如師子」。下面是本品走成的路。","end2":"請帶走這一句：「於般涅槃而不永滅」——示現甲，而不著甲。想再深一層，去讀本做本品十題過關檢核。","ROAD":["頗有三昧","通達而不入","內不離菩提心","而不畢竟入於涅槃","善哉善哉","唯有大莊嚴者","有三昧名首楞嚴","而不永滅","十二重而不","獨步無畏"],"SEG":{"1":{"lab":"第一段","n":"堅意菩薩白佛","t":120,"ch":"2-1"},"2":{"lab":"第二段","n":"佛告堅意・善哉善哉","t":372,"ch":"3-1"},"3":{"lab":"第三段","n":"有三昧名首楞嚴","t":578,"ch":"4-1"}},"A":[{"id":"A1","seg":1,"ch":"1-1","round":"第一段","q":"堅意菩薩一口氣要了十項功德——這不就是貪多嗎？","basis":"疾得菩提、破魔、自然智、受無量命，一項接一項","keep":"功德愈多愈好","name":"需求規格・重點在「同時」","tag":"十項不是並列的本事；每一項後面都將扣上一條約束","gist":"這一串不是十種本事的並列，而是一份需求規格的第一欄：重點不在「多」，而在「同時」。後面各補上一條約束——通達而不入、內不離菩提心、不畢竟入於涅槃——把答案逼到只剩一種可能。","src":[{"lab":"原典・第一段","q":"世尊！頗有三昧，能令菩薩疾得阿耨多羅三藐三菩提，常得不離值見諸佛"}],"next":"規格的第二欄是三乘：菩薩既然通達聲聞法，為什麼不乾脆入聲聞道？"},{"id":"A2","seg":1,"ch":"2-3","round":"第一段","q":"既然通達聲聞法，入聲聞道不是順理成章？","basis":"學通了，自然就走那條路","keep":"通達了就要歸入","name":"通達而不入","tag":"通達是完全掌握其法與用；不入是不以它為究竟歸宿","gist":"「通達」是完全掌握其法義與功用，不是淺嘗；「不入」是不以它為究竟歸宿。只通達而不「不入」，就成了聲聞；只「不入」而不通達，又無從接引樂聲聞的人。大乘的難處不在拒絕，而在深入而不被定型。","src":[{"lab":"原典・第一段","q":"通達聲聞法而不入聲聞道，通達辟支佛法而不入辟支佛道，通達佛法而不畢竟滅盡"}],"next":"不入聲聞道，卻又「示現聲聞形色威儀」——外現聲聞相、內是菩提心，這不是作假嗎？"},{"id":"A3","seg":1,"ch":"5-2","round":"第一段","q":"外現聲聞的形色威儀，內心卻是菩提心——這不是表裡不一、作假嗎？","basis":"外面一套，裡面一套","keep":"內外不同就是虛偽","name":"現此相而不成此類人","tag":"威儀如法具足，不是偽裝；相無自性，所以現而不成","gist":"示現不是演戲欺人：聲聞的威儀如法具足，事相上真實無欺。「內不離佛菩提心」是說此相無自性，所以現聲聞相，並不因此成了聲聞人。內與外不是兩個地方，而是同一件事的兩種說法。","src":[{"lab":"原典・第一段","q":"示現聲聞形色威儀，而內不離佛菩提心"}],"next":"連如來的入胎、出家、轉法輪、入涅槃都能示現。列了這麼多，堅意最後到底在怕什麼？"},{"id":"A4","seg":1,"ch":"2-4","round":"第一段","q":"堅意菩薩怕的，是自己能力不夠、做不到這些示現？","basis":"求三昧，通常是為了增加能力","keep":"發問是因為能力不足","name":"重音在「而不畢竟入於涅槃」","tag":"怕的不是「不能」，而是「能了之後回不來」","gist":"全問的重音落在最後一句。堅意擔心的不是能力不足，而是智慧愈深、離繫愈徹底，愈容易一入永寂、不再回頭；可是眾生無盡，一入永寂，利他就斷了。所以他問「行何三昧」，不問「行何功德」。","src":[{"lab":"原典・第一段","q":"行何三昧，能令菩薩示現如是諸功德事，而不畢竟入於涅槃？"}],"next":"問題提得這麼精準，佛卻不馬上回答，反而先說「善哉善哉」——為什麼？"},{"id":"A5","seg":2,"ch":"3-3","round":"第二段","q":"佛先說「善哉！善哉！」，只是答問前的客套吧？","basis":"答問之前，照例先稱讚","keep":"讚歎只是儀節","name":"讚問・六重印可","tag":"先讚「問」，不先答「問」：能問對問題，本身就是一種說法","gist":"佛先讚「問」，不先答「問」。所讚的是問題本身的品質：這一問能饒益安樂眾生，今世後世的菩薩都蒙益。接著回溯堅意的因地——深種善根、親近諸佛、遍行諸道、得自在智、教化菩薩、成就問答。這不是恭維，是一份因緣的清單。","src":[{"lab":"原典・第二段","q":"善哉！善哉！堅意！能問如來如是之義。"},{"lab":"原典・第二段","q":"曾於恒河沙等佛所，成就問答"}],"next":"佛又說：天、龍、聲聞、緣覺，都問不出這一問。這是在排聖位高低嗎？"},{"id":"A6","seg":2,"ch":"3-4","round":"第二段","q":"天、龍、聲聞、緣覺都問不出——這是在排聖位的高低？","basis":"被排除的，聽起來都比菩薩低","keep":"能不能問，看果位","name":"斷層在框架，不在果位","tag":"果位懸殊的四類同列一處；界線是容不容得下「示現而不著」","gist":"被排除的名單橫跨天、非人、聲聞、緣覺，果位差距極大，卻同列一處。可見界線不在證量高低，而在框架：把涅槃與輪迴看成互斥兩端的人，「示現涅槃而不永滅」是自相矛盾的句子，自然問不出來。唯有大莊嚴者兩頭都不肯放，才會撞上這道題。","src":[{"lab":"原典・第二段","q":"唯有汝等大莊嚴者，乃能啟發如是之問"}],"next":"佛預告這個三昧「得是功德復過於此」。堅意說「願樂欲聞」，佛說出名字：首楞嚴——卻不下定義？"},{"id":"A7","seg":3,"ch":"4-2","round":"第三段","q":"佛只說「有三昧名首楞嚴」，卻不下定義——這不是說得太少？","basis":"講一個法門，總要先說清楚它是什麼","keep":"名字底下必須有個定義","name":"先標名・後顯相","tag":"義由十二重示現自行顯露；說法方式本身就在示無自性","gist":"經文只標名，不下定義；它的意思由下文十二重「而不」自己顯露。這不是省略，而是說法方式本身就在示無自性：清單有盡，這個三昧給的是能無盡生出功德的原理，所以「復過於此」。首楞嚴，義為健行、勇伏，如勇士堅固前行，不可沮壞。","src":[{"lab":"原典・第二段","q":"得是功德復過於此。"},{"lab":"原典・第三段","q":"有三昧名首楞嚴"}],"next":"第一句就說「示現於般涅槃而不永滅」——示現入滅，卻又不滅，這不是自相矛盾？"},{"id":"A8","seg":3,"ch":"6-1","round":"第三段","q":"示現入涅槃，卻又「不永滅」——這不是自相矛盾？","basis":"滅就是滅，不滅就是不滅","keep":"涅槃是進去就不再出來的處所","name":"於般涅槃而不永滅・不常不斷","tag":"見佛入滅，是世俗諦；法性本無生滅，是勝義諦；兩句各就一邊","gist":"這是本品的樞紐句。眾生見佛入滅、見舍利分布，所以說「示現般涅槃」；法性本無生滅，所以說「而不永滅」。遮斷：涅槃不是灰身滅智的斷絕；遮常：也沒有一個恆常實體在裡面出入。堅意怕的「一入不返」，前提是把涅槃當成處所；這一句把處所取消了。","src":[{"lab":"原典・第三段","q":"皆能示現於般涅槃而不永滅"}],"next":"接著十一句一路排下去，句句「而不」——是十二種不同的神通嗎？"},{"id":"A9","seg":3,"ch":"4-3","round":"第三段","q":"十二句「而不」，就是十二種不同的神通？","basis":"一句一個境界，像一張功德表","keep":"十二重是十二項本事","name":"一個句型・十二處不失手","tag":"〔示現甲〕＋〔而不著甲〕：生死、形色、國土……十二個可能失手的地方","gist":"十二重共用同一個句法骨架：前半是示現，後半以「而不」或「而知」反扣。它涉及的境域——生死、形色、國土、諸佛、諸行、位次、魔境、三界、諸趣、語言、禪定、生滅——是十二個可能失手的地方，不是十二種神通。掌握這個句型，就能自己套入任何境界。","src":[{"lab":"原典・第三段","q":"遍遊一切諸佛國土，而於國土無所分別"},{"lab":"原典・第三段","q":"行於盡忍無生法忍，而說諸法有生滅相"}],"next":"句型掌握了，結尾卻用一隻師子收束：要無所畏懼，躲進深山不是更安穩？"},{"id":"A10","seg":3,"ch":"4-4","round":"第三段","q":"要無所畏懼，離開紛擾、獨處深山不是最安穩？","basis":"遠離境界，就沒有東西可怕","keep":"無畏要靠離境","name":"獨步無畏・入群而不失己","tag":"師子的無畏顯在群獸之中；畏生於執，無可失，故無所畏","gist":"師子的無畏，不在無獸的深山，而在群獸之中。菩薩遍入三界諸趣，乃至現行魔力，而法相不動：入群而不失己。畏生於執；於十二境都不見有自性可得，就沒有可失的，所以無所畏。第一段「得無生智能不隨他」，正是「獨步」的伏筆；也正因無畏，才敢不入涅槃。","src":[{"lab":"原典・第一段","q":"得無生智能不隨他"},{"lab":"原典・第三段","q":"獨步無畏猶如師子。"}],"next":""}],"W":[{"seg":1,"q":"疾得阿耨多羅三藐三菩提","a":"迅速證得無上正等正覺","x":["很快得到一件名叫阿耨多羅的寶物","急著想要得到菩提，所以心很焦躁","疾病痊癒以後，才證得菩提"]},{"seg":1,"q":"常得不離值見諸佛","a":"時時不離諸佛、常得見佛","x":["常常離開諸佛，自己去修行","得到不必離家的機會去見佛","值得一看的佛像，常常去參拜"]},{"seg":1,"q":"得自在慧以破諸魔","a":"得到自在的智慧以破除種種魔障","x":["過著自由自在的生活，不再被魔打擾","用自己的聰明去打敗魔王的軍隊","自在地與魔相處，不必破除"]},{"seg":1,"q":"得無生智能不隨他","a":"得到通達無生的智慧，因而不必依賴他人印證","x":["得到不再投生的智慧，從此不跟任何人學","沒有生起智慧，所以不能跟隨他人","得到長生不老的智慧，不必聽別人的話"]},{"seg":1,"q":"得如意足，受無量命","a":"得到隨意自在的神足，享有無量的壽命","x":["得到如意寶珠與足夠的錢財，長命百歲","心滿意足，接受無常的命運","腳力隨心所欲，能走無量遠的路"]},{"seg":1,"q":"通達聲聞法而不入聲聞道","a":"完全通達聲聞之法，卻不落入聲聞的果位","x":["通曉聲聞法，但還沒有能力進入聲聞道","聽得懂聲聞的說法，卻不願意聽","走遍聲聞的道路，卻找不到入口"]},{"seg":1,"q":"通達佛法而不畢竟滅盡","a":"完全通達佛法，卻不因此就究竟灰滅","x":["通達佛法，但還沒有完全滅盡煩惱","通達佛法以後，佛法就永遠不會滅","通達佛法，卻不肯把它講完"]},{"seg":1,"q":"示現聲聞形色威儀，而內不離佛菩提心","a":"外表示現出聲聞的形貌與行止，內心卻不曾離開求證佛果的菩提心","x":["外表裝成聲聞，內心卻瞧不起聲聞","顯出聲聞的容貌，內心還沒有發菩提心","聲聞的威儀做給人看，菩提心藏著不讓人知道"]},{"seg":1,"q":"以如幻三昧力，示現如來形色威儀","a":"憑藉如幻三昧的力量，示現如來的形貌與威儀","x":["用幻術變出如來的樣子讓人相信","靠三昧的力量，把自己變成真正的如來","如來的威儀其實是幻覺，根本沒有"]},{"seg":1,"q":"以方便力現入涅槃","a":"憑藉善巧方便的力量示現進入涅槃","x":["為了方便起見，乾脆進入涅槃","用最省力的辦法進入涅槃","等到有空的時候，才進入涅槃"]},{"seg":2,"q":"憐愍世間利安天人","a":"憐憫世間、利益安頓天人","x":["可憐世間的人，只照顧天上的人","愛惜世間的財物，安頓天神","同情世間，請天人下來幫忙"]},{"seg":2,"q":"遍行諸道降魔怨敵","a":"普遍行過種種道路、降伏了魔軍怨敵","x":["走遍各地的道路，與魔結下怨仇","修學各種外道，向魔投降","到處講道理，被 死，而別有涅槃，","實相義如是，云何有分別？"]},"V12":{"p":"觀五陰品第四","v":["若離於色因，色則不可得；","若當離於色，色因不可得。"]},"V13":{"p":"觀因緣品第一 · 歸敬偈","v":["不生亦不滅，不常亦不斷，","不一亦不異，不來亦不出。"]},"V14":{"p":"觀如來品第二十二","v":["如來所有性，即是世間性；","如來無有性，世間亦無性。"]},"V15":{"p":"觀顛倒品第二十三","v":["若因淨不淨，顛倒生三毒，","三毒即無性，故煩惱無實。"]},"V16":{"p":"觀燃可燃品第十","v":["若法因待成，是法還成待，","今則無因待，亦無所成法。"]},"V17":{"p":"觀法品第十八","v":["業煩惱滅故，名之為解脫；","業煩惱非實，入空戲論滅。"]},"V18":{"p":"觀去來品第二","v":["已去無有去，未去亦無去，","離已去未去，去時亦無去。"]},"V19":{"p":"觀本際品第十一","v":["大聖之所說，本際不可得，","生死無有始，亦復無有終。"]},"V20":{"p":"觀法品第十八","v":["諸法實相者，心行言語斷，","無生亦無滅，寂滅如涅槃。"]},"V21":{"p":"觀四諦品第二十四","v":["以有空義故，一切法得成；","若無空義者，一切則不成。"]},"V22":{"p":"觀業品第十七","v":["雖空亦不斷，雖有亦不常，","業果報不失，是名佛所說。"]},"V23":{"p":"觀邪見品第二十七","v":["瞿曇大聖主，憐愍說是法，","悉斷一切見，我今稽首禮。"]}},"K":[{"seg":1,"ch":"2-2","q":"頗有三昧，能令菩薩疾得阿耨多羅三藐三菩提","h":"所求的功德愈多，愈要先破其自性見","a":"V1","d":"二諦不礙：正因無可得，才說得、說疾。","o":["V7","V16","V22"]},{"seg":1,"ch":"2-2","q":"通達聲聞法而不入聲聞道","h":"連「空」都不可執為所歸，何況三乘之相","a":"V2","d":"菩薩通達三乘而不入，正是不讓所學之法變成新的自性執","o":["V9","V13","V18"]},{"seg":1,"ch":"2-2","q":"示現聲聞形色威儀，而內不離佛菩提心","h":"現聲聞相，不成聲聞人","a":"V3","d":"正因相無自性，故現而不成","o":["V12","V19","V21"]},{"seg":1,"ch":"2-2","q":"以如幻三昧力，示現如來形色威儀","h":"同一個幻喻：一用於解縛，一用於起用","a":"V4","d":"緣起與如幻，是同一事的兩面。","o":["V10","V15","V6"]},{"seg":1,"ch":"2-2","q":"行何三昧，能令菩薩示現如是諸功德事，而不畢竟入於涅槃？","h":"取消「涅槃是一個處所」","a":"V5","d":"既無可入之處，自無永入之患。","o":["V11","V17","V8"]},{"seg":2,"ch":"3-2","q":"善哉！善哉！堅意！能問如來如是之義。","h":"凡夫之問生於缺，菩薩之問生於見","a":"V6","d":"堅意之問正正踩在二諦交會處","o":["V9","V3","V20"]},{"seg":2,"ch":"3-2","q":"當知汝已深種善根，供養親近過去無量百千億佛","h":"能發此問，也只依眾緣而來","a":"V7","d":"法之生起唯依眾緣","o":["V16","V1","V14"]},{"seg":2,"ch":"3-2","q":"不見天、龍、夜叉、乾闥婆，及諸聲聞、求辟支佛者，能作是問","h":"被排除的，是把涅槃與世間看成有、無兩端的眼光","a":"V8","d":"有此二見者，「示現涅槃而不永滅」即成矛盾句，自然無從問起。","o":["V5","V2","V23"]},{"seg":2,"ch":"3-2","q":"願樂欲聞","h":"離言，正須由言而入","a":"V9","d":"捨此言說，勝義諦亦無由趣入","o":["V20","V6","V10"]},{"seg":3,"ch":"4-2","q":"有三昧名首楞嚴","h":"先標名、後顯相","a":"V10","d":"於勝義諦上此名並無所詮的自性體，故但以假名而說。","o":["V1","V20","V7"]},{"seg":3,"ch":"4-2","q":"皆能示現於般涅槃而不永滅","h":"涅槃非斷滅，生滅非 /* ───────── 工具 ───────── */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const CN='零一二三四五六七八九十';
const cn=n=>n<=10?CN[n]:(n<20?'十'+CN[n-10]:CN[Math.floor(n/10)]+'十'+(n%10?CN[n%10]:''));
const mmss=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
const store={get(k,d){try{const v=localStorage.getItem('slgz1:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('slgz1:'+k,JSON.stringify(v));}catch(e){}}};
const SITE='https://weiwen0925.github.io/surangama-samadhi-sutra/', GATE='https://weiwen0925.github.io/dazhidulun-0/#sl-videos';
const PINS=Object.keys(P).map(Number).sort((a,b)=>a-b);

const bestKey=n=>n===1?'best':'best:p'+n;
const READ=()=>SITE+'#chapter-1-'+D.pin+'-', BLQ=()=>SITE+'#blq-'+D.pin;
function verseHTML(s){
  if(s.v) return `<div class="verse"><div class="lab">${esc(s.lab)}</div>${s.v.map(l=>`<p class="ln">${esc(l)}</p>`).join('')}${s.src?`<p class="src">──《中論》${esc(s.src)}</p>`:''}</div>`;
  return `<div class="verse"><div class="lab">${esc(s.lab)}</div><p class="quote">「${esc(s.q)}」</p></div>`;
}
const chName=c=>{const p=String(c).split('-');return `第${cn(+p[0])}章第${cn(+p[1])}節`;};
function vlink(seg,ch){
  const s=D.SEG[seg], c=ch||s.ch;
  return `<p class="vlink"><a href="https://youtu.be/${D.vid}?t=${s.t}" target="_blank" rel="noopener">▶ 回看影片・${esc(s.lab)} ${mmss(s.t)}</a><a href="${READ()}${c}" target="_blank" rel="noopener">讀本・${chName(c)} →</a></p>`;
}
function stages(){
  return [
   {k:'o1',t:D.o1t,d:`排出${cn(D.A.length)}個疑問`},
   {k:'d1',t:'過招',d:'疑者出招，你接'},
   {k:'w1',t:'經文白話',d:'一句一句拆'},
   {k:'f1',t:'原文填空',d:'經文名句'},
   {k:'k1',t:'中論對讀',d:'經文↔中論頌'},
   {k:'m',t:'配對快打',d:'疑問↔答招'}
  ];
}
let S={stage:0,best:{},sub:null};
function setPin(n){D=P[n]||P[PINS[0]];S.best=store.get(bestKey(D.pin),{});}
function hashOf(){return D.pin===1?'#'+stages()[S.stage].k:'#p'+D.pin+'-'+stages()[S.stage].k;}
function parseHash(h){
  h=(h||'').replace(/^#/,'');
  let m=/^p(\d+)(?:-(\w+))?$/.exec(h), pin=PINS[0], k=null;
  if(m){pin=+m[1];k=m[2]||null;} else if(h) k=h;
  if(!P[pin]) pin=PINS[0];
  return {pin,k};
}

  $('#vol').innerHTML=`<b>卷上 · 第${cn(D.pin)}品</b>${esc(D.name)}`;
  $('#sub').textContent=D.sub;
  $('#backs').innerHTML=`<a href="${GATE}">← 回首楞嚴導讀影片</a><a class="yt" href="https://youtu.be/${D.vid}" target="_blank" rel="noopener">▶ 本品導讀影片 ${esc(D.dur)}</a><a href="${SITE}#chapter-${D.pin}" target="_blank" rel="noopener">讀本・卷上第${cn(D.pin)}品</a><a href="${BLQ()}" target="_blank" rel="noopener">⚔ 讀本闖關檢核</a>`;
  $('#pins').innerHTML=PINS.map(n=>`<button class="pin" data-p="${n}" aria-current="${n===D.pin}"><b>第${cn(n)}品</b><span>${esc(P[n].name)}</span></button>`).join('');
  document.querySelectorAll('.pin').forEach(b=>b.onclick=()=>{const n=+b.dataset.p;if(n!==D.pin)switchPin(n);});
}
function switchPin(n){if(timer){clearInterval(timer);timer=null;}setPin(n);S.stage=0;S.sub=null;try{history.replaceState(null,'',hashOf());}catch(e){}renderHead();renderNav();render();window.scrollTo({top:0,behavior:'smooth'});}

function renderNav(){
  const st=stages();
  $('#stages').innerHTML=st.map((s,i)=>{
    const b=S.best[s.k];
    const mark=b==null?'':(s.k==='m'?`最佳 ${b} 秒`:`最佳 ${b}`);
    return `<button class="stg" data-i="${i}" aria-current="${i===S.stage}"><b>第${cn(i+1)}關</b><span>${esc(s.t)}</span><em>${mark||esc(s.d)}</em></button>`;
  }).join('');
  document.querySelectorAll('.stg').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function go(i){S.stage=i;S.sub=null;try{history.replaceState(null,'',hashOf());}catch(e){}renderNav();render();window.scrollTo({top:0,behavior:'smooth'});}
function saveBest(k,v,lowerBetter){
  const o=S.best[k];
  if(o==null||(lowerBetter?v<o:(+String(v).split('/')[0])>(+String(o).split('/')[0]))){S.best[k]=v;store.set(bestKey(D.pin),S.best);}
}
function render(){
  const k=stages()[S.stage].k;
  if(k==='o1') orderStage();
  if(k==='d1') duelStage();
  if(k==='w1') choiceStage('w1');
  if(k==='f1') fillStage();
  if(k==='k1') choiceStage('k1');
  if(k==='m') matchStage();
}

/* ───────── 第一關：問題鏈排序 ───────── */
function orderStage(){
  const list=D.A;
  if(!S.sub) S.sub={pool:shuffle(list.map(x=>x.id)),seq:[],checked:false};
  const st=S.sub, byId=Object.fromEntries(list.map(x=>[x.id,x]));
  const head=`<div class="ptitle"><h2>${esc(D.o1n)}・疑者${cn(list.length)}問</h2><p>${list.length} 張卡</p></div><p class="hint">${esc(D.o1h)}</p>`;
  if(!st.checked){
    const cards=st.pool.map(id=>{const p=st.seq.indexOf(id);return `<button class="ocard${p>=0?' sel':''}" data-id="${id}"><span class="n">${p>=0?p+1:''}</span><span class="t">${esc(byId[id].q)}</span></button>`;}).join('');
    $('#main').innerHTML=`<section class="panel">${head}<div class="olist">${cards}</div>
      <div class="bar"><span class="score">已排 ${st.seq.length} / ${list.length}　點已排的卡可退回</span>
      <span style="display:flex;gap:8px"><button class="btn ghost" id="reset">重排</button><button class="btn" id="check" ${st.seq.length<list.length?'disabled':''}>核對</button></span></div></section>`;
    document.querySelectorAll('.ocard').forEach(b=>b.onclick=()=>{
      const id=b.dataset.id,p=st.seq.indexOf(id);
      if(p>=0) st.seq=st.seq.slice(0,p); else st.seq.push(id);
      render();
    });
    $('#reset').onclick=()=>{st.seq=[];render();};
    $('#check').onclick=()=>{st.checked=true;render();};
    return;
  }
  const right=list.map(x=>x.id); let ok=0;
  const rows=right.map((id,i)=>{
    const good=st.seq[i]===id; if(good) ok++;
    const x=byId[id], s=D.SEG[x.seg];
    const yours=good?'':`<span class="score">（你排在第 ${st.seq.indexOf(id)+1} 位）</span>`;
    const link=i<right.length-1&&x.next?`<p class="link">↓ ${esc(x.next)}</p>`:'';
    return `<div class="ocard ${good?'good':'badpos'}"><span class="n">${i+1}</span><span class="t">${esc(x.q)} ${yours}<br><span class="score">${esc(x.round)}・${esc(s.n)}　放不下：${esc(x.keep)}</span>　<a href="https://youtu.be/${D.vid}?t=${s.t}" target="_blank" rel="noopener">▶ ${mmss(s.t)}</a></span></div>${link}`;
  }).join('');
  saveBest('o1',`${ok}/${list.length}`);
  $('#main').innerHTML=`<section class="panel">${head}
    <div class="end"><p class="big">${ok} / ${list.length}</p><p class="hint">綠色是位置正確，紅色是排錯的位置。每兩張卡之間的朱字，就是經文「為什麼下一步這樣接」。</p></div>
    <div class="olist">${rows}</div>
    <div class="bar"><button class="btn ghost" id="again">再排一次</button><button class="btn" id="nextStage">下一關</button></div></section>`;
  $('#again').onclick=()=>{S.sub=null;render();};
  $('#nextStage').onclick=()=>go(S.stage+1);
  renderNav();
}

/* ───────── 第二關：疑者出招・你替經文接 ───────── */
function duelStage(){
  const list=D.A;
  if(!S.sub) S.sub={i:0,phase:'ask',score:0,opts:null,pick:null};
  const st=S.sub;
  if(st.i>=list.length) return duelEnd();
  const x=list[st.i];
  if(!st.opts) st.opts=shuffle([x.id,...shuffle(list.filter(y=>y.id!==x.id).map(y=>y.id)).slice(0,3)]);
  const byId=Object.fromEntries(list.map(y=>[y.id,y]));
  const prev=st.i>0?list[st.i-1].next:'';
  let html=`<section class="panel"><div class="ptitle"><h2>過招・${esc(D.short)}</h2><p>第 ${st.i+1} / ${list.length} 回合</p></div>
   ${prev?`<p class="retreat">${esc(prev)}</p>`:''}
   <div class="qrow"><div class="pill"><i>第${cn(st.i+1)}問</i><small>${esc(x.round)}</small></div><div class="qt"><p class="qbig">${esc(x.q)}</p><p class="qmeta">疑從哪來：<b>${esc(x.basis)}</b>｜放不下：<b>${esc(x.keep)}</b></p></div></div>
   <p class="hint">經文用哪一招接住這個疑問？</p>
   <div class="opts">${st.opts.map(id=>{const o=byId[id];let c='';
     if(st.phase!=='ask'){ if(id===x.id) c='right'; else if(id===st.pick) c='wrong'; else c='dim'; }
     return `<button class="opt ${c}" data-id="${id}" ${st.phase!=='ask'?'disabled':''}><strong>${esc(o.name)}</strong><span>${esc(o.tag)}</span></button>`;}).join('')}</div>`;
  if(st.phase!=='ask'){
    const good=st.pick===x.id, w=byId[st.pick];
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'接得正著':'這一招接偏了'}</h3>
      ${good?'':`<p>「${esc(w.name)}」接的是另一個疑問：${esc(w.q)} 這一問，疑者放不下的是「${esc(x.keep)}」。正解是「${esc(x.name)}」。</p>`}
      <p><b>經文怎麼接：</b>${esc(x.gist)}</p>${x.src.map(verseHTML).join('')}${vlink(x.seg,x.ch)}</div>
      <div class="bar"><span class="score">接對 ${st.score}</span><button class="btn" id="nx">${st.i===list.length-1?'看結果':'下一回合'}</button></div>`;
  } else {
    html+=`<div class="bar"><span class="score">接對 ${st.score}</span></div>`;
  }
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.pick=b.dataset.id;if(st.pick===x.id)st.score++;st.phase='answered';render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.phase='ask';st.opts=null;st.pick=null;render();window.scrollTo({top:0,behavior:'smooth'});};
}
function duelEnd(){
  const st=S.sub,n=D.A.length;
  saveBest('d1',`${st.score}/${n}`);
  const nextPin=PINS.find(p=>p>D.pin);
  $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>過招結束</h2></div>
   <div class="end"><p class="big">接對 ${st.score} / ${n}</p>
   <p class="hint">${esc(D.end1)}</p>
   <div class="road">${D.ROAD.map((r,i)=>`<span>${esc(r)}</span>${i<D.ROAD.length-1?'<i>→</i>':''}`).join('')}</div>
   <p class="hint">${esc(D.end2)}</p></div>
   <div class="bar"><a class="btn ghost" href="${BLQ()}" target="_blank" rel="noopener" style="text-decoration:none">⚔ 讀本闖關檢核</a><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="again">再打一輪</button>${nextPin?`<button class="btn ghost" id="nextPin">前往第${cn(nextPin)}品 →</button>`:''}<button class="btn" id="nextStage">下一關</button></span></div></section>`;
  $('#again').onclick=()=>{S.sub=null;render();};
  $('#nextStage').onclick=()=>go(S.stage+1);
  const np=$('#nextPin'); if(np) np.onclick=()=>switchPin(nextPin);
  renderNav();
}

/* ───────── 第三、五關：難句白話／關鍵提醒（四選一） ───────── */
function choiceStage(key){
  const isW=key==='w1', list=isW?D.W:D.K, N=Math.min(10,list.length);
  const title=isW?'經文白話':'中論對讀';
  if(!S.sub) S.sub={list:shuffle(list.map((_,i)=>i)).slice(0,N),i:0,score:0,pick:null,opts:null};
  const st=S.sub;
  if(st.i>=st.list.length){
    saveBest(key,`${st.score}/${st.list.length}`);
    $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>${title}結束</h2></div><div class="end"><p class="big">${st.score} / ${st.list.length}</p><p class="hint">每輪從 ${list.length} 題中隨機抽 ${N} 題，多玩幾輪就能全部遇到。${isW?'正解都是讀本「白話直譯」的原句。':'每一首頌與說明，都出自讀本各章的「中觀義理」卡。'}</p></div>
      <div class="bar"><button class="btn ghost" id="again">再來一輪</button><button class="btn" id="nextStage">下一關</button></div></section>`;
    $('#again').onclick=()=>{S.sub=null;render();};$('#nextStage').onclick=()=>go(S.stage+1);renderNav();return;
  }
  const it=list[st.list[st.i]];
  if(!st.opts) st.opts=shuffle([it.a,...(isW?it.x:it.o)]);
  const optHTML=o=>{const vv=D.V[o];return `<strong>${esc(vv.v[0])}<br>${esc(vv.v[1])}</strong><span>《中論》${esc(vv.p)}</span>`;};
  let html=`<section class="panel"><div class="ptitle"><h2>${title}</h2><p>第 ${st.i+1} / ${st.list.length} 題</p></div>
    <p class="hint">${isW?'這一句經文，白話是哪一個？錯的選項都是常見的誤讀。':'讀本為這一句經文配了哪一首《中論》頌？'}</p>
    <div class="verse"><div class="lab">原典・${esc(D.SEG[it.seg].lab)}・${esc(D.SEG[it.seg].n)}</div><p class="quote">「${esc(it.q)}」</p></div>
    ${isW?'':`<p class="retreat">要點：${esc(it.h)}</p>`}
    <div class="opts">${st.opts.map((o,j)=>{let c='';
      if(st.pick!=null){ if(o===it.a) c='right'; else if(o===st.pick) c='wrong'; else c='dim'; }
      return isW?`<button class="opt plain ${c}" data-j="${j}" ${st.pick!=null?'disabled':''}>${esc(o)}</button>`
               :`<button class="opt ${c}" data-j="${j}" ${st.pick!=null?'disabled':''}>${optHTML(o)}</button>`;}).join('')}</div>`;
  if(st.pick!=null){
    const good=st.pick===it.a;
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'對了':'不是這個意思'}</h3>
      ${isW?`<p><b>讀本白話：</b>${esc(it.a)}</p>${vlink(it.seg)}`:`${verseHTML({lab:'讀本所引',v:D.V[it.a].v,src:D.V[it.a].p})}<p><b>讀本中觀義理：</b>${esc(it.d)}</p>${vlink(it.seg,it.ch)}`}</div>
      <div class="bar"><span class="score">答對 ${st.score}</span><button class="btn" id="nx">${st.i===st.list.length-1?'看結果':'下一題'}</button></div>`;
  } else html+=`<div class="bar"><span class="score">答對 ${st.score}</span></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.opt[data-j]').forEach(b=>b.onclick=()=>{st.pick=st.opts[+b.dataset.j];if(st.pick===it.a)st.score++;render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.pick=null;st.opts=null;render();window.scrollTo({top:0,behavior:'smooth'});};
}

/* ───────── 第四關：原文填空 ───────── */
function fillStage(){
  if(!S.sub) S.sub={list:shuffle(D.F.map((_,i)=>i)).slice(0,Math.min(10,D.F.length)),i:0,score:0,pick:null,opts:null};
  const st=S.sub;
  if(st.i>=st.list.length){
    saveBest('f1',`${st.score}/${st.list.length}`);
    $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>原文填空結束</h2></div><div class="end"><p class="big">${st.score} / ${st.list.length}</p><p class="hint">每輪從 ${D.F.length} 句中隨機抽 ${st.list.length} 句，多玩幾輪就能全部遇到。</p></div>
      <div class="bar"><button class="btn ghost" id="again">再來一輪</button><button class="btn" id="nextStage">下一關</button></div></section>`;
    $('#again').onclick=()=>{S.sub=null;render();};$('#nextStage').onclick=()=>go(S.stage+1);renderNav();return;
  }
  const f=D.F[st.list[st.i]];
  if(!st.opts) st.opts=shuffle(f.opts);
  const lines=f.v.map((l,j)=>{
    if(j!==f.ln) return `<p class="ln">${esc(l)}</p>`;
    const p=l.indexOf(f.ans);
    const fill=st.pick?`<span class="blank filled">${esc(f.ans)}</span>`:`<span class="blank">　</span>`;
    return `<p class="ln">${esc(l.slice(0,p))}${fill}${esc(l.slice(p+f.ans.length))}</p>`;
  }).join('');
  let html=`<section class="panel"><div class="ptitle"><h2>原文填空</h2><p>第 ${st.i+1} / ${st.list.length} 句</p></div>
    <p class="hint">選出空格裡的字。原典一字不改，填的是鳩摩羅什譯本的原文。</p>
    <div class="verse"><div class="lab">原典・${esc(D.SEG[f.seg].lab)}・${esc(D.SEG[f.seg].n)}</div>${lines}</div>
    <div class="chips">${st.opts.map(o=>{let c='';if(st.pick){if(o===f.ans)c='right';else if(o===st.pick)c='wrong';}
      return `<button class="chip ${c}" data-o="${esc(o)}" ${st.pick?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>`;
  if(st.pick){
    const good=st.pick===f.ans;
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'對了':'不是「'+esc(st.pick)+'」'}</h3><p>這一句在本品的位置：<b>${esc(f.note)}</b>。</p>${vlink(f.seg)}</div>
      <div class="bar"><span class="score">答對 ${st.score}</span><button class="btn" id="nx">${st.i===st.list.length-1?'看結果':'下一句'}</button></div>`;
  } else html+=`<div class="bar"><span class="score">答對 ${st.score}</span></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.chip[data-o]').forEach(b=>b.onclick=()=>{st.pick=b.dataset.o;if(st.pick===f.ans)st.score++;render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.pick=null;st.opts=null;render();};
}

/* ───────── 第六關：配對快打 ───────── */
let timer=null;
function matchStage(){
  if(!S.sub){
    const pool=shuffle(D.A).slice(0,Math.min(6,D.A.length));
    S.sub={pairs:pool,left:shuffle(pool.map(x=>x.id)),right:shuffle(pool.map(x=>x.id)),done:[],pickL:null,miss:0,t0:null,t:0,bad:null};
  }
  const st=S.sub, byId=Object.fromEntries(st.pairs.map(x=>[x.id,x]));
  const finished=st.done.length===st.pairs.length;
  if(finished&&timer){clearInterval(timer);timer=null;saveBest('m',+st.t.toFixed(1),true);}
  let html=`<section class="panel"><div class="ptitle"><h2>配對快打</h2><p>每輪 ${st.pairs.length} 組，計時</p></div>
   <p class="hint">先點左邊「疑者放不下的」，再點右邊經文接住它的那一招。配錯會記一次失手。</p>
   <div class="bar"><span class="score" id="clock">用時 ${st.t.toFixed(1)} 秒｜失手 ${st.miss}｜已配 ${st.done.length} / ${st.pairs.length}</span>${S.best.m!=null?`<span class="score">最佳 ${S.best.m} 秒</span>`:''}</div>
   <div class="mgrid"><div class="mcol"><h4>疑者放不下</h4>${st.left.map(id=>{const x=byId[id];
      const c=st.done.includes(id)?'done':(st.pickL===id?'pick':'');
      return `<button class="mi ${c}" data-l="${id}" ${st.done.includes(id)?'disabled':''}><span class="src">${esc(x.round)}</span>${esc(x.keep)}</button>`;}).join('')}</div>
   <div class="mcol"><h4>經文的招</h4>${st.right.map(id=>{const x=byId[id];
      const c=st.done.includes(id)?'done':(st.bad===id?'shake':'');
      return `<button class="mi ${c}" data-r="${id}" ${st.done.includes(id)?'disabled':''}>${esc(x.name)}</button>`;}).join('')}</div></div>`;
  if(finished) html+=`<div class="end"><p class="big">${st.t.toFixed(1)} 秒・失手 ${st.miss}</p><p class="hint">${cn(st.pairs.length)}組全配上了。再來一輪會換一批題。</p><div class="bar" style="width:100%"><button class="btn" id="again">再來一輪</button><button class="btn ghost" id="first">回第一關</button></div></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.mi[data-l]').forEach(b=>b.onclick=()=>{
    if(!st.t0){st.t0=performance.now();timer=setInterval(()=>{st.t=(performance.now()-st.t0)/1000;const c=$('#clock');if(c)c.textContent=`用時 ${st.t.toFixed(1)} 秒｜失手 ${st.miss}｜已配 ${st.done.length} / ${st.pairs.length}`;},100);}
    st.pickL=b.dataset.l;st.bad=null;render();
  });
  document.querySelectorAll('.mi[data-r]').forEach(b=>b.onclick=()=>{
    if(!st.pickL) return;
    if(b.dataset.r===st.pickL){st.done.push(st.pickL);st.pickL=null;st.bad=null;}
    else{st.miss++;st.bad=b.dataset.r;}
    render();
  });
  const ag=$('#again'); if(ag) ag.onclick=()=>{S.sub=null;render();};
  const fs=$('#first'); if(fs) fs.onclick=()=>go(0);
  renderNav();
}

/* ───────── 開場 ───────── */
function applyHash(){
  const r=parseHash(location.hash);
  setPin(r.pin);
  const hi=r.k?stages().findIndex(s=>s.k===r.k):-1;
  S.stage=hi>=0?hi:0; S.sub=null;
}
function start(d){
  applyHash();
  if(d&&typeof d.pin==='number'&&P[d.pin]){setPin(d.pin);}
  if(d&&typeof d.stage==='number'){S.stage=d.stage;S.sub=d.sub||null;}
  renderHead();renderNav();render();
}
window.addEventListener('hashchange',()=>{const r=parseHash(location.hash);const hi=r.k?stages().findIndex(s=>s.k===r.k):0;if(r.pin===D.pin&&hi===S.stage)return;if(timer){clearInterval(timer);timer=null;}applyHash();renderHead();renderNav();render();});
window.claude?.hot?.snapshot?.(()=>({pin:D.pin,stage:S.stage,sub:S.stage===5?null:S.sub}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
